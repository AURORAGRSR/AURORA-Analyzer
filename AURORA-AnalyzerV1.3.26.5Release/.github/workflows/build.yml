name: AURORA Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./Scripts -Recurse -Severity Warning,Error
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            throw "Found $($results.Count) script analysis issues"
          }
          Write-Host "No issues found"
        shell: pwsh

  build-validation:
    name: Build Validation
    runs-on: windows-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Build Script Syntax
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content .\build.ps1 -Raw), [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "Syntax error: $_" }
            exit 1
          }
          Write-Host "Build script syntax validation passed"
        shell: pwsh

  test:
    name: Pester Tests
    runs-on: windows-latest
    needs: [build-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester Tests
        run: |
          if (Test-Path ./test) {
            Install-Module Pester -Force -Scope CurrentUser
            $pesterConfig = @{
              Run = @{ Path = './test'; PassThru = $true }
              Output = @{ Verbosity = 'Detailed' }
            }
            $result = Invoke-Pester -Configuration $pesterConfig
            if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) test(s) failed"
            }
          } else {
            Write-Host "No test directory found, skipping tests"
          }
        shell: pwsh

  build:
    name: Build Artifact
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if (Test-Path .\build.ps1) {
            .\build.ps1 -IncrementVersion -NonInteractive
          } else {
            Write-Host "No build script found, skipping"
          }
        shell: pwsh
        env:
          AURORA_BUILD_PASSWORD: ${{ secrets.BUILD_PASSWORD }}
